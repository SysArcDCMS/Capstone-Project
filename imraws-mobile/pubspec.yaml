name: maynilad_app
description: Maynilad Water Services — Mobile App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.0
  provider: ^6.1.1
  intl: ^0.19.0
  # Pin picker maps. OpenFreeMap vector tiles need no API key, no billing
  # account and no Google Play Services, which google_maps_flutter did.
  flutter_map: ^8.3.2
  flutter_map_vector_tiles: ^2.9.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
